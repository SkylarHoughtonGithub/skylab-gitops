# Argo CD cluster Secret for the local k3d dev cluster.
#
# Even though Argo CD lives in-cluster, we register a NAMED cluster entry
# so the root ApplicationSet's cluster generator sees it (selector:
# skylab.io/managed=true) and so `destination.name` resolves to the file
# `clusters/skylab-dev.yaml`.
#
# Applied by `task dev:register`.

apiVersion: v1
kind: Secret
metadata:
  name: skylab-dev-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    skylab.io/managed: "true"
    skylab.io/env: dev
    skylab.io/cloud: k3d
    skylab.io/role: hub
type: Opaque
stringData:
  name: skylab-dev
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig":{"insecure":false}}
