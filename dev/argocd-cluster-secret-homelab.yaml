# Argo CD cluster Secret for the local k3d homelab hub.
#
# Named `homelab` so the root ApplicationSet template renders
# clusters/homelab.yaml as the per-cluster override. In-cluster Argo
# resolves the destination via name even though server is the
# in-cluster API.
#
# Applied by `task hub:register`.

apiVersion: v1
kind: Secret
metadata:
  name: homelab-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
    skylab.io/managed: "true"
    skylab.io/env: homelab
    skylab.io/cloud: k3d
    skylab.io/role: hub
type: Opaque
stringData:
  name: homelab
  server: https://kubernetes.default.svc
  config: |
    {"tlsClientConfig":{"insecure":false}}
