# Per-cluster config for the local k3d dev cluster.
# Overlaid on top of charts/skylab-apps/values.yaml and values-dev.yaml.
#
# Minimal set enabled for first bring-up: the components that come up
# cleanly without external inputs (no cloud identity, no DNS). Flip the
# rest on incrementally as their prereqs land.

components:
  cert-manager:
    enabled: true
  external-secrets:
    enabled: true
  kyverno:
    enabled: true
  kubevela:
    enabled: true
  # ComponentDefinitions (currently just `go-service`) that Backstage
  # golden-path templates render into platform/tenants Applications.
  # Lives alongside the kubevela operator in vela-system.
  kubevela-defs:
    enabled: true

  # Trust layer: offline root CA managed by skylab-terraform/scripts/skylab-ca.sh.
  # step-ca / step-issuer / trust-manager stay off; leaf certs land as
  # pre-staged kubernetes.io/tls Secrets per workload that needs one.

  # Observability. kube-prometheus-stack scrapes metrics; Alloy ships
  # pod logs to Loki; Tempo stores traces (Alloy OTLP forwarding ships
  # in a follow-up once workloads emit spans); Sloth generates burn-rate
  # PrometheusRules from PrometheusServiceLevel CRs (none yet). Grafana
  # discovers Prometheus/Loki/Tempo datasources via its provisioning
  # sidecar.
  kube-prometheus-stack:
    enabled: true
  grafana:
    enabled: true
  loki:
    enabled: true
  alloy:
    enabled: true
  tempo:
    enabled: true
  sloth:
    enabled: true

  # Backstage. Pulls ghcr.io/skylarhoughtongithub/skylab-backstage:latest.
  # OIDC + Gitea integration env vars default to empty strings so the
  # sign-in page falls back to guest and the Gitea entity-discovery
  # provider logs a config error — expected until Gitea (wave 4) is
  # enabled with credentials wired via ExternalSecret.
  backstage:
    enabled: true

  # First real workload. Proves Tempo (OTel traces) and Sloth
  # (PrometheusServiceLevel) end-to-end. Its Certificate (StepClusterIssuer)
  # will stay Pending now that the trust layer is offline-root — expected
  # until demo-service is switched to a SelfSigned issuer or step-ca comes
  # back in-cluster.
  demo-service:
    enabled: true

  # Second workload — reference app for the Backstage go-service template.
  # DEV_AUTH_BYPASS=true so the pod comes up without external Google
  # credentials. Phase 2 cutover (Oct 2026) moved Postgres out to the
  # sibling `mechatracker-db` Application below, which needs wave 1
  # (Crossplane) + real cloud credentials to actually provision. On
  # dev k3d (no cloud creds), the api pod will fail to start because
  # the `db-url` secret never materializes — expected until an
  # EC2/EKS cluster lights up wave 1. See workloads/mechatracker/README.md.
  mechatracker:
    enabled: true

  # Sibling Postgres Application. Flipped on alongside mechatracker so the
  # shape is visible even without working Crossplane. The XR stays as a
  # dangling CR on dev until wave 1 + cloud credentials come up.
  mechatracker-db:
    enabled: true

  # Default-off in dev until their external prereqs are stubbed:
  #   crossplane / crossplane-providers    — need cloud credentials
  #   gitea / act-runner                   — act-runner needs a token Secret
  #   argo-cd (self-manage)                — enable after other components settle
