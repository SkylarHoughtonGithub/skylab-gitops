# Per-cluster overrides for the homelab hub.
# Overlaid on top of charts/skylab-apps/values.yaml and values-<env>.yaml.

components:
  argo-cd:
    enabled: true
  cert-manager:
    enabled: true
  external-secrets:
    enabled: true
  # step-ca / step-issuer / trust-manager stay off: trust layer is an
  # offline root CA managed by skylab-terraform/scripts/skylab-ca.sh.
  # Leaf certs for workloads land as pre-staged kubernetes.io/tls Secrets.
  kyverno:
    enabled: true
  crossplane:
    enabled: true
  crossplane-providers:
    enabled: true
  kubevela:
    enabled: true
  gitea:
    enabled: true
  act-runner:
    enabled: true
