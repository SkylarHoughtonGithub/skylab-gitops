# Per-cluster overrides for the homelab hub.
# Overlaid on top of charts/skylab-apps/values.yaml and values-<env>.yaml.

components:
  argo-cd:
    enabled: true
  cert-manager:
    enabled: true
  external-secrets:
    enabled: true
  step-ca:
    enabled: true
  step-issuer:
    enabled: true
  trust-manager:
    enabled: true
  kyverno:
    enabled: true
  crossplane:
    enabled: true
  crossplane-providers:
    enabled: true
  kubevela:
    enabled: true
  gitea:
    enabled: true
  act-runner:
    enabled: true
