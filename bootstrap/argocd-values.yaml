# Argo CD install values (wave -2, self-managed after bootstrap).
# Pinned chart version lives in bootstrap/README.md.

global:
  logging:
    format: json

configs:
  params:
    server.insecure: false
  cm:
    # Required so sync waves wait on child Application health.
    # Argo CD stopped assessing child Application health in 1.8;
    # without this Lua, waves do not block on child app readiness.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Permit the three AppProjects we render out of charts/skylab-apps.
    application.resourceTrackingMethod: annotation
    # Fleet-wide ignoreDifferences for fields that in-cluster controllers
    # populate at admission or runtime. Without these, Argo reports every
    # affected resource as OutOfSync forever even though nothing is wrong.
    resource.customizations.ignoreDifferences.kyverno.io_ClusterPolicy: |
      jsonPointers:
        - /spec/admission
        - /spec/background
        - /spec/emitWarning
    resource.customizations.ignoreDifferences.apiregistration.k8s.io_APIService: |
      jsonPointers:
        - /spec/caBundle
  rbac:
    policy.default: role:readonly

server:
  ingress:
    enabled: false

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: true

# Self-management: after bootstrap, Argo CD syncs itself through
# charts/argo-cd/values.yaml. Keep this file semantically identical
# to charts/argo-cd/values.yaml under the `argo-cd:` key so the
# first self-sync is a no-op.
