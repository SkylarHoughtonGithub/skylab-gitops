# Argo CD install values (wave -2, self-managed after bootstrap).
# Pinned chart version lives in bootstrap/README.md.

global:
  logging:
    format: json

configs:
  params:
    server.insecure: false
  cm:
    # Required so sync waves wait on child Application health.
    # Argo CD stopped assessing child Application health in 1.8;
    # without this Lua, waves do not block on child app readiness.
    resource.customizations.health.argoproj.io_Application: |
      hs = {}
      hs.status = "Progressing"
      hs.message = ""
      if obj.status ~= nil then
        if obj.status.health ~= nil then
          hs.status = obj.status.health.status
          if obj.status.health.message ~= nil then
            hs.message = obj.status.health.message
          end
        end
      end
      return hs
    # Permit the three AppProjects we render out of charts/skylab-apps.
    application.resourceTrackingMethod: annotation
  rbac:
    policy.default: role:readonly

server:
  ingress:
    enabled: false

dex:
  enabled: false

notifications:
  enabled: false

applicationSet:
  enabled: true

# Self-management: after bootstrap, Argo CD syncs itself through
# the `argo-cd` wrapper chart in charts/argo-cd (added in a later wave -2 PR).
