{{- if .Values.clusterSecretStores.gcp.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStores.gcp.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    skylab.io/component: external-secrets
spec:
  provider:
    gcpsm:
      projectID: {{ required ".Values.clusterSecretStores.gcp.projectID is required" .Values.clusterSecretStores.gcp.projectID }}
      auth:
        workloadIdentity:
          clusterLocation: {{ required ".Values.clusterSecretStores.gcp.workloadIdentity.clusterLocation is required" .Values.clusterSecretStores.gcp.workloadIdentity.clusterLocation }}
          clusterName: {{ required ".Values.clusterSecretStores.gcp.workloadIdentity.clusterName is required" .Values.clusterSecretStores.gcp.workloadIdentity.clusterName }}
          serviceAccountRef:
            name: {{ .Values.clusterSecretStores.gcp.workloadIdentity.serviceAccountRef.name }}
            namespace: {{ .Values.clusterSecretStores.gcp.workloadIdentity.serviceAccountRef.namespace }}
{{- end }}
