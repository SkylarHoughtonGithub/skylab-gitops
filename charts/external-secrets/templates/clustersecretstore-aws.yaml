{{- if .Values.clusterSecretStores.aws.enabled }}
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: {{ .Values.clusterSecretStores.aws.name }}
  annotations:
    # Needs the credentials Secret, which is populated by an out-of-band
    # Roles Anywhere credential refresher. Defer past wave 0 so step-ca
    # and step-issuer can issue the mTLS cert the refresher consumes.
    argocd.argoproj.io/sync-wave: "1"
  labels:
    skylab.io/component: external-secrets
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ required ".Values.clusterSecretStores.aws.region is required" .Values.clusterSecretStores.aws.region }}
      auth:
        secretRef:
          accessKeyIDSecretRef:
            name: {{ .Values.clusterSecretStores.aws.credentialsSecret.name }}
            namespace: {{ .Values.clusterSecretStores.aws.credentialsSecret.namespace }}
            key: {{ .Values.clusterSecretStores.aws.credentialsSecret.accessKeyIdKey }}
          secretAccessKeySecretRef:
            name: {{ .Values.clusterSecretStores.aws.credentialsSecret.name }}
            namespace: {{ .Values.clusterSecretStores.aws.credentialsSecret.namespace }}
            key: {{ .Values.clusterSecretStores.aws.credentialsSecret.secretAccessKeyKey }}
          {{- if .Values.clusterSecretStores.aws.credentialsSecret.sessionTokenKey }}
          sessionTokenSecretRef:
            name: {{ .Values.clusterSecretStores.aws.credentialsSecret.name }}
            namespace: {{ .Values.clusterSecretStores.aws.credentialsSecret.namespace }}
            key: {{ .Values.clusterSecretStores.aws.credentialsSecret.sessionTokenKey }}
          {{- end }}
{{- end }}
