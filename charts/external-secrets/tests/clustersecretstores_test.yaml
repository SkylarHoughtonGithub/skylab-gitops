suite: external-secrets ClusterSecretStores
templates:
  - templates/clustersecretstore-aws.yaml
  - templates/clustersecretstore-gcp.yaml

tests:
  - it: renders no stores by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the AWS ClusterSecretStore when enabled
    template: templates/clustersecretstore-aws.yaml
    set:
      clusterSecretStores.aws.enabled: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterSecretStore
      - equal:
          path: apiVersion
          value: external-secrets.io/v1
      - equal:
          path: metadata.name
          value: aws-secrets-manager
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "1"
      - equal:
          path: spec.provider.aws.service
          value: SecretsManager
      - equal:
          path: spec.provider.aws.region
          value: us-east-1
      - equal:
          path: spec.provider.aws.auth.secretRef.accessKeyIDSecretRef.name
          value: eso-aws-credentials
      - equal:
          path: spec.provider.aws.auth.secretRef.accessKeyIDSecretRef.key
          value: access_key_id
      - equal:
          path: spec.provider.aws.auth.secretRef.sessionTokenSecretRef.key
          value: session_token

  - it: omits sessionTokenSecretRef when sessionTokenKey is blank
    template: templates/clustersecretstore-aws.yaml
    set:
      clusterSecretStores.aws.enabled: true
      clusterSecretStores.aws.credentialsSecret.sessionTokenKey: ""
    asserts:
      - notExists:
          path: spec.provider.aws.auth.secretRef.sessionTokenSecretRef

  - it: renders the GCP ClusterSecretStore when enabled
    template: templates/clustersecretstore-gcp.yaml
    set:
      clusterSecretStores.gcp.enabled: true
      clusterSecretStores.gcp.projectID: skylab-platform
      clusterSecretStores.gcp.workloadIdentity.clusterLocation: us-central1
      clusterSecretStores.gcp.workloadIdentity.clusterName: skylab-hub
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ClusterSecretStore
      - equal:
          path: metadata.name
          value: gcp-secret-manager
      - equal:
          path: spec.provider.gcpsm.projectID
          value: skylab-platform
      - equal:
          path: spec.provider.gcpsm.auth.workloadIdentity.clusterLocation
          value: us-central1
      - equal:
          path: spec.provider.gcpsm.auth.workloadIdentity.clusterName
          value: skylab-hub
      - equal:
          path: spec.provider.gcpsm.auth.workloadIdentity.serviceAccountRef.name
          value: external-secrets
