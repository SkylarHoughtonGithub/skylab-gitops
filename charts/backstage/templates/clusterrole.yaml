{{- if .Values.rbac.create }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: backstage-view
  labels:
    skylab.io/component: backstage
rules:
  # Read-only on the standard workload / networking / config objects that
  # Backstage's Kubernetes plugin surfaces on each entity page.
  - apiGroups: [""]
    resources:
      - pods
      - pods/log
      - services
      - configmaps
      - secrets
      - events
      - nodes
      - namespaces
      - limitranges
      - resourcequotas
      - persistentvolumeclaims
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources:
      - deployments
      - replicasets
      - statefulsets
      - daemonsets
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources:
      - jobs
      - cronjobs
    verbs: ["get", "list", "watch"]
  - apiGroups: ["autoscaling"]
    resources:
      - horizontalpodautoscalers
    verbs: ["get", "list", "watch"]
  - apiGroups: ["networking.k8s.io"]
    resources:
      - ingresses
      - networkpolicies
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metrics.k8s.io"]
    resources:
      - pods
      - nodes
    verbs: ["get", "list"]
  # KubeVela custom resources — matches the customResources list in the
  # skylab-backstage app-config so Applications / Component- and
  # TraitDefinitions show up on entity pages.
  - apiGroups: ["core.oam.dev"]
    resources:
      - applications
      - componentdefinitions
      - traitdefinitions
    verbs: ["get", "list", "watch"]
  # Crossplane custom resources — same reason.
  - apiGroups: ["apiextensions.crossplane.io"]
    resources:
      - compositeresourcedefinitions
    verbs: ["get", "list", "watch"]
  - apiGroups: ["pkg.crossplane.io"]
    resources:
      - providers
      - configurations
      - functions
    verbs: ["get", "list", "watch"]
  # Argo CD resources so entity pages can show the Application / AppProject
  # that owns the workload (the ArgoCD plugin itself talks to argocd-server,
  # but the K8s plugin surfaces the CRs on the entity page too).
  - apiGroups: ["argoproj.io"]
    resources:
      - applications
      - appprojects
    verbs: ["get", "list", "watch"]
  # cert-manager — workloads request certs via Certificate (see demo-service).
  - apiGroups: ["cert-manager.io"]
    resources:
      - certificates
      - certificaterequests
      - issuers
      - clusterissuers
    verbs: ["get", "list", "watch"]
  # Prometheus Operator — ServiceMonitors / PodMonitors / PrometheusRules
  # scraped by kube-prometheus-stack and rendered by workloads at wave 10.
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
      - podmonitors
      - prometheusrules
    verbs: ["get", "list", "watch"]
  # Sloth — PrometheusServiceLevel rolls up into burn-rate alerts; shown on
  # the entity page alongside the ServiceMonitor it SLOs against.
  - apiGroups: ["sloth.slok.dev"]
    resources:
      - prometheusservicelevels
    verbs: ["get", "list", "watch"]
{{- end }}
