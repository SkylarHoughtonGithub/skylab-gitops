suite: backstage RBAC
templates:
  - templates/clusterrole.yaml
  - templates/clusterrolebinding.yaml

tests:
  - it: renders both the ClusterRole and ClusterRoleBinding by default
    asserts:
      - hasDocuments:
          count: 1
        template: templates/clusterrole.yaml
      - hasDocuments:
          count: 1
        template: templates/clusterrolebinding.yaml

  - it: renders nothing when rbac.create is false
    set:
      rbac.create: false
    asserts:
      - hasDocuments:
          count: 0
        template: templates/clusterrole.yaml
      - hasDocuments:
          count: 0
        template: templates/clusterrolebinding.yaml

  - it: ClusterRole is read-only on every rule
    template: templates/clusterrole.yaml
    asserts:
      - isKind:
          of: ClusterRole
      - equal:
          path: metadata.name
          value: backstage-view
      - equal:
          path: metadata.labels["skylab.io/component"]
          value: backstage
      - contains:
          path: rules[0].verbs
          content: get
      - contains:
          path: rules[0].verbs
          content: list
      - contains:
          path: rules[0].verbs
          content: watch
      - notContains:
          path: rules[0].verbs
          content: create
      - notContains:
          path: rules[0].verbs
          content: update
      - notContains:
          path: rules[0].verbs
          content: delete

  - it: ClusterRole covers the API groups the K8s plugin reads
    template: templates/clusterrole.yaml
    asserts:
      - contains:
          path: rules
          content:
            apiGroups: [""]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["apps"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["batch"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["autoscaling"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["networking.k8s.io"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["metrics.k8s.io"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["core.oam.dev"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["apiextensions.crossplane.io"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["pkg.crossplane.io"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["argoproj.io"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["cert-manager.io"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["monitoring.coreos.com"]
          any: true
      - contains:
          path: rules
          content:
            apiGroups: ["sloth.slok.dev"]
          any: true

  - it: ClusterRoleBinding points at the backstage SA in the backstage namespace
    template: templates/clusterrolebinding.yaml
    asserts:
      - isKind:
          of: ClusterRoleBinding
      - equal:
          path: metadata.name
          value: backstage-view
      - equal:
          path: roleRef.kind
          value: ClusterRole
      - equal:
          path: roleRef.name
          value: backstage-view
      - equal:
          path: subjects[0].kind
          value: ServiceAccount
      - equal:
          path: subjects[0].name
          value: backstage
      - equal:
          path: subjects[0].namespace
          value: backstage
