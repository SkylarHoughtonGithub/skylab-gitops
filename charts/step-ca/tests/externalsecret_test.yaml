suite: step-ca provisioner ExternalSecret
templates:
  - templates/externalsecret-provisioner.yaml

tests:
  - it: renders nothing by default
    asserts:
      - hasDocuments:
          count: 0

  - it: renders an ExternalSecret when enabled
    set:
      provisionerSecret.enabled: true
      provisionerSecret.remoteRef.key: skylab/step-ca/admin-provisioner
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: ExternalSecret
      - equal:
          path: apiVersion
          value: external-secrets.io/v1beta1
      - isNotNullOrEmpty:
          path: metadata.name
      - equal:
          path: metadata.namespace
          value: step-ca
      - equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "2"
      - equal:
          path: spec.secretStoreRef.kind
          value: ClusterSecretStore
      - equal:
          path: spec.secretStoreRef.name
          value: aws-secrets-manager
      - isNotNullOrEmpty:
          path: spec.target.name
      - isNotNullOrEmpty:
          path: spec.data[0].secretKey
      - equal:
          path: spec.data[0].remoteRef.key
          value: skylab/step-ca/admin-provisioner

  - it: requires remoteRef.key when enabled
    set:
      provisionerSecret.enabled: true
    asserts:
      - failedTemplate:
          errorMessage: ".Values.provisionerSecret.remoteRef.key is required when the ExternalSecret is enabled"
