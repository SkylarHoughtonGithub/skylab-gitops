{{- if .Values.provisionerSecret.enabled }}
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: {{ .Values.provisionerSecret.name }}
  namespace: {{ .Values.namespace.name }}
  annotations:
    # Needs the ESO ClusterSecretStore. CSS carries sync-wave 1; this
    # ExternalSecret sits one wave later so Argo waits until the store
    # is ready before trying to resolve the remote secret.
    argocd.argoproj.io/sync-wave: "2"
  labels:
    skylab.io/component: step-ca
spec:
  refreshInterval: {{ .Values.provisionerSecret.refreshInterval }}
  secretStoreRef:
    kind: ClusterSecretStore
    name: {{ .Values.provisionerSecret.secretStoreRef.name }}
  target:
    name: {{ .Values.provisionerSecret.target.name }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.provisionerSecret.target.key }}
      remoteRef:
        key: {{ required ".Values.provisionerSecret.remoteRef.key is required when the ExternalSecret is enabled" .Values.provisionerSecret.remoteRef.key }}
        {{- with .Values.provisionerSecret.remoteRef.property }}
        property: {{ . }}
        {{- end }}
{{- end }}
