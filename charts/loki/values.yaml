# kube-prometheus-stack owns the monitoring namespace; this wrapper
# only renders the Namespace resource when run standalone.
namespace:
  create: false
  name: monitoring

# Grafana datasource ConfigMap, picked up by the Grafana sidecar via
# label `grafana_datasource=1`. Default-off until Grafana is enabled.
datasource:
  enabled: true
  url: http://loki.monitoring.svc.cluster.local:3100

loki:
  # Dev default: monolithic Loki with filesystem storage.
  # Production overlays flip to SimpleScalable + S3 by overriding
  # deploymentMode, loki.storage, loki.schemaConfig, and the sub-component
  # replica counts.
  deploymentMode: SingleBinary

  loki:
    auth_enabled: false
    commonConfig:
      replication_factor: 1
    schemaConfig:
      configs:
        - from: "2024-01-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage:
      type: filesystem
    # Fleet-wide ServiceMonitor; relies on kube-prometheus-stack's
    # label-less discovery.
    pattern_ingester:
      enabled: false
    limits_config:
      allow_structured_metadata: true
      retention_period: 72h  # dev-tight; prod overlays raise this

  singleBinary:
    replicas: 1
    persistence:
      enabled: true
      size: 10Gi

  # SimpleScalable components off in dev.
  backend:
    replicas: 0
  read:
    replicas: 0
  write:
    replicas: 0

  # Caches require extra pods and are overkill for a single-binary dev
  # instance; prod overlays flip them on.
  chunksCache:
    enabled: false
  resultsCache:
    enabled: false

  # Dev doesn't need the self-canary or minio sidecar.
  lokiCanary:
    enabled: false
  minio:
    enabled: false

  # Gateway is an nginx reverse proxy that fronts the scalable
  # deployment; skip it in SingleBinary so clients hit the Loki Service
  # directly.
  gateway:
    enabled: false

  monitoring:
    selfMonitoring:
      enabled: false
      grafanaAgent:
        installOperator: false

  test:
    enabled: false
