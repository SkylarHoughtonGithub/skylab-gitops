{{- if .Values.datasource.enabled }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-grafana-datasource
  namespace: {{ .Values.namespace.name }}
  labels:
    skylab.io/component: loki
    # Picked up by Grafana's provisioning sidecar.
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: {{ .Values.datasource.url }}
        jsonData:
          maxLines: 1000
{{- end }}
