suite: alloy Namespace
templates:
  - templates/namespace.yaml

tests:
  - it: renders no Namespace by default (kube-prometheus-stack owns it)
    asserts:
      - hasDocuments:
          count: 0

  - it: renders the Namespace when standalone
    set:
      namespace.create: true
    asserts:
      - hasDocuments:
          count: 1
      - isKind:
          of: Namespace
      - equal:
          path: metadata.name
          value: monitoring
      - equal:
          path: metadata.annotations["skylab.io/wave"]
          value: "5"
