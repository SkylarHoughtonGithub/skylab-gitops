apiVersion: v2
name: alloy
description: Skylab wrapper for Grafana Alloy. DaemonSet collector that forwards pod logs + kubelet logs + Kubernetes events to Loki; replaces Promtail which reached EOL in March 2026. Metrics are left to kube-prometheus-stack scrapers.
type: application
version: 0.1.0
appVersion: "1.20.1"
dependencies:
  - name: alloy
    repository: https://grafana.github.io/helm-charts
    # Pin deliberately; bump via a PR after reviewing release notes.
    version: 1.14.3
