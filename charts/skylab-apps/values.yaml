# Default source for component charts. Overridden per env or per cluster.
repoURL: https://github.com/SkylarHoughtonGithub/skylab-gitops.git
targetRevision: main

# AppProjects. Each is rendered to argocd namespace.
appProjects:
  platform:
    description: Platform-owned components (observability, Gitea, KubeVela, Crossplane, AI).
    sourceRepos:
      - https://github.com/SkylarHoughtonGithub/skylab-gitops.git
      - https://charts.jetstack.io
      - https://charts.external-secrets.io
      - https://argoproj.github.io/argo-helm
    destinations:
      - server: '*'
        namespace: '*'
    clusterResourceWhitelist:
      - group: '*'
        kind: '*'
  tenants:
    description: KubeVela Applications and infra requests scaffolded by Backstage.
    sourceRepos:
      - https://gitea.example.com/platform/tenants.git
    destinations:
      - server: '*'
        namespace: '*'
    namespaceResourceWhitelist:
      - group: core.oam.dev
        kind: '*'
  workloads:
    description: Platform-owned KubeVela Applications in this repo.
    sourceRepos:
      - https://github.com/SkylarHoughtonGithub/skylab-gitops.git
    destinations:
      - server: '*'
        namespace: '*'
    # Only Namespace is cluster-scoped; everything else a workload needs
    # (Deployment, Service, Secret, Certificate, PrometheusServiceLevel)
    # is namespaced and rendered downstream by KubeVela, not by Argo CD.
    clusterResourceWhitelist:
      - group: ""
        kind: Namespace
    namespaceResourceWhitelist:
      - group: core.oam.dev
        kind: '*'

# Components. Each becomes an Argo CD Application if enabled.
# Enable per cluster via clusters/<name>.yaml.
#
# Fields:
#   enabled           - whether this component renders an Application
#   wave              - sync-wave annotation value (string)
#   namespace         - target namespace; defaults to the component name
#   project           - AppProject (default: platform)
#   path              - repo path to the component chart (default: charts/<name>)
#   extraValueFiles   - extra values files relative to the chart path
#   sourceType        - "helm" (default) or "directory" for raw manifests
components:
  argo-cd:
    enabled: false
    wave: "-2"
    namespace: argocd
    project: platform
  cert-manager:
    enabled: false
    wave: "-1"
    namespace: cert-manager
    project: platform
  external-secrets:
    enabled: false
    wave: "-1"
    namespace: external-secrets
    project: platform
  step-ca:
    enabled: false
    wave: "0"
    namespace: step-ca
    project: platform
  # Roles Anywhere credential refresher. CronJob that writes short-lived
  # AWS session creds into eso-aws-credentials for the ESO AWS CSS to read.
  # Shares external-secrets ns so the Role patching the Secret stays scoped.
  aws-signing-helper:
    enabled: false
    wave: "0"
    namespace: external-secrets
    project: platform
  step-issuer:
    enabled: false
    wave: "0"
    namespace: step-issuer
    project: platform
  trust-manager:
    enabled: false
    wave: "0"
    namespace: cert-manager
    project: platform
  kyverno:
    enabled: false
    wave: "0"
    namespace: kyverno
    project: platform
  crossplane:
    enabled: false
    wave: "1"
    namespace: crossplane-system
    project: platform
  crossplane-providers:
    enabled: false
    wave: "1"
    namespace: crossplane-system
    project: platform
  skylab-crossplane:
    enabled: false
    wave: "2"
    namespace: crossplane-system
    project: platform
  kubevela:
    enabled: false
    wave: "3"
    namespace: vela-system
    project: platform
  kubevela-defs:
    enabled: false
    wave: "3"
    namespace: vela-system
    project: platform
  gitea:
    enabled: false
    wave: "4"
    namespace: gitea
    project: platform
  act-runner:
    enabled: false
    wave: "4"
    namespace: gitea
    project: platform
  kube-prometheus-stack:
    enabled: false
    wave: "5"
    namespace: monitoring
    project: platform
  grafana:
    enabled: false
    wave: "5"
    namespace: monitoring
    project: platform
  loki:
    enabled: false
    wave: "5"
    namespace: monitoring
    project: platform
  alloy:
    enabled: false
    wave: "5"
    namespace: monitoring
    project: platform
  tempo:
    enabled: false
    wave: "5"
    namespace: monitoring
    project: platform
  sloth:
    enabled: false
    wave: "5"
    namespace: monitoring
    project: platform
  backstage:
    enabled: false
    wave: "6"
    namespace: backstage
    project: platform
  # First real workload: proves cert-manager (StepClusterIssuer),
  # Tempo (OTel traces) and Sloth (PrometheusServiceLevel) end-to-end.
  # Raw-manifest source — the Application CR is hand-written rather
  # than scaffolded through a Backstage template.
  demo-service:
    enabled: false
    wave: "10"
    namespace: demo-service
    project: workloads
    path: workloads/demo-service
    sourceType: directory

  # Reference workload for the Backstage go-service golden-path template.
  # Hand-written baseline today; regenerated by the template once
  # skylab-backstage + Gitea come up. See workloads/mechatracker/README.md
  # for why this stays disabled until the go-service ComponentDefinition
  # grows env/envFrom support.
  mechatracker:
    enabled: false
    wave: "10"
    namespace: mechatracker
    project: workloads
    path: workloads/mechatracker
    sourceType: directory

  # Sibling of `mechatracker` that provisions Postgres via the Skylab
  # `postgres` ComponentDefinition — matches the shape Backstage's
  # database golden-path template emits. Lands as a separate Application
  # so sync/delete lifecycles are independent of the api. Needs wave 1
  # (crossplane + crossplane-providers) and real cloud credentials to
  # actually provision; stays off in dev until an EC2/EKS cluster brings
  # them up.
  mechatracker-db:
    enabled: false
    wave: "10"
    namespace: mechatracker
    project: workloads
    path: workloads/mechatracker-db
    sourceType: directory
