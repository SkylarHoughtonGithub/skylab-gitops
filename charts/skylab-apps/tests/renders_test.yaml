suite: skylab-apps renders
templates:
  - templates/appprojects.yaml
  - templates/applications.yaml

tests:
  # AppProjects render in alphabetical order of their key in values:
  # platform (0), tenants (1), workloads (2).
  - it: renders three AppProjects, alphabetically ordered
    template: templates/appprojects.yaml
    asserts:
      - hasDocuments:
          count: 3
      - documentIndex: 0
        isKind:
          of: AppProject
      - documentIndex: 0
        equal:
          path: metadata.name
          value: platform
      - documentIndex: 1
        equal:
          path: metadata.name
          value: tenants
      - documentIndex: 2
        equal:
          path: metadata.name
          value: workloads
      - documentIndex: 0
        equal:
          path: metadata.namespace
          value: argocd
      # workloads project allows Namespace creation so Argo CD can
      # bring up a workload's namespace via CreateNamespace=true.
      - documentIndex: 2
        contains:
          path: spec.clusterResourceWhitelist
          content:
            group: ""
            kind: Namespace

  - it: renders no Applications when nothing is enabled
    template: templates/applications.yaml
    asserts:
      - hasDocuments:
          count: 0

  - it: renders only the enabled components
    template: templates/applications.yaml
    set:
      components:
        cert-manager:
          enabled: true
          wave: "-1"
          namespace: cert-manager
          project: platform
        external-secrets:
          enabled: false
          wave: "-1"
    asserts:
      - hasDocuments:
          count: 1
      - documentIndex: 0
        isKind:
          of: Application
      - documentIndex: 0
        equal:
          path: metadata.name
          value: cert-manager

  - it: applies sync-wave, project, path and destination
    template: templates/applications.yaml
    set:
      components:
        cert-manager:
          enabled: true
          wave: "-1"
          namespace: cert-manager
          project: platform
    asserts:
      - documentIndex: 0
        equal:
          path: metadata.annotations["argocd.argoproj.io/sync-wave"]
          value: "-1"
      - documentIndex: 0
        equal:
          path: spec.project
          value: platform
      - documentIndex: 0
        equal:
          path: spec.source.path
          value: charts/cert-manager
      - documentIndex: 0
        equal:
          path: spec.destination.namespace
          value: cert-manager
      - documentIndex: 0
        equal:
          path: spec.syncPolicy.automated.selfHeal
          value: true

  # Default source is helm: the Application's source block carries a
  # `helm:` with values.yaml plus any extraValueFiles.
  - it: emits a helm source block by default
    template: templates/applications.yaml
    set:
      components:
        cert-manager:
          enabled: true
          wave: "-1"
          namespace: cert-manager
          project: platform
          extraValueFiles:
            - values-skylab-dev.yaml
    asserts:
      - documentIndex: 0
        equal:
          path: spec.source.helm.valueFiles
          value:
            - values.yaml
            - values-skylab-dev.yaml

  # Directory source: no `helm:` block, so Argo CD syncs the path as
  # raw manifests. Used by workloads under workloads/<name>/.
  - it: omits the helm block when sourceType is directory
    template: templates/applications.yaml
    set:
      components:
        demo-service:
          enabled: true
          wave: "10"
          namespace: demo-service
          project: workloads
          path: workloads/demo-service
          sourceType: directory
    asserts:
      - documentIndex: 0
        equal:
          path: spec.source.path
          value: workloads/demo-service
      - documentIndex: 0
        equal:
          path: spec.project
          value: workloads
      - documentIndex: 0
        notExists:
          path: spec.source.helm
