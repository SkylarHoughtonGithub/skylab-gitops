apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: disallow-latest-tag
  annotations:
    policies.kyverno.io/title: Disallow :latest tag
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: medium
spec:
  validationFailureAction: {{ .Values.policies.action }}
  background: true
  rules:
    - name: require-image-tag
      match:
        any:
          - resources:
              kinds: [Pod]
      exclude:
        any:
          - resources:
              namespaces:
                {{- toYaml .Values.excludedNamespaces | nindent 16 }}
      validate:
        message: Images must specify an explicit tag, not :latest and not tag-less.
        pattern:
          spec:
            containers:
              - image: "!*:latest & *:*"
