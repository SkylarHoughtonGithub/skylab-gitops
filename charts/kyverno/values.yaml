namespace:
  create: true
  name: kyverno

# Policies default to Audit while the platform is still being built out.
# Flip to Enforce once workloads are compliant.
policies:
  action: Audit

# Namespaces excluded from every ClusterPolicy. System namespaces plus
# Kyverno itself (self-admission loops).
excludedNamespaces:
  - kube-system
  - kube-public
  - kube-node-lease
  - kyverno
  - argocd

kyverno:
  features:
    policyExceptions:
      enabled: true

  # Bitnami removed `bitnami/kubectl:1.30.2` from Docker Hub in 2026, which
  # breaks every Helm hook that uses it (seen in dev as `kyverno-clean-reports`
  # stuck in ImagePullBackOff on upgrade). `bitnamilegacy` is Bitnami's archive
  # repo for the removed images; drop-in replacement, same tag.
  policyReportsCleanup:
    image:
      repository: bitnamilegacy/kubectl
      tag: "1.30.2"
