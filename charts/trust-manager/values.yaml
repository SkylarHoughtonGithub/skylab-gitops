# trust-manager runs in the cert-manager namespace. The skylab-apps
# component for this chart sets destination.namespace accordingly, so
# no Namespace template is needed here.

trust-manager:
  namespace: cert-manager
  app:
    trust:
      namespace: cert-manager

# Bundles distributed to tenant namespaces. Each is default-off; enable
# per cluster. Sync-wave 1 so Argo waits for step-ca to publish its root
# before trust-manager tries to source it.
bundles:
  stepCA:
    enabled: false
    name: skylab-ca
    # Source: step-ca's auto-generated ConfigMap in the step-ca namespace.
    # The step-certificates chart's init Job populates this with the
    # files under /home/step/certs — root_ca.crt is the hub root.
    sourceConfigMap:
      name: step-ca-step-certificates-certs
      key: root_ca.crt
    target:
      # ConfigMap of this name lands in every namespace matched below.
      # Mount at /etc/ssl/certs/skylab-ca.crt or set NODE_EXTRA_CA_CERTS.
      configMapKey: ca.crt
      # Optional JKS / PKCS12 formats for JVM / .NET consumers.
      additionalFormats: {}
      # Namespaces opt in with this label.
      namespaceSelector:
        skylab.io/trust: enabled
