# Homelab overlay for aws-signing-helper. Fill in from Terraform outputs
# after applying skylab-terraform/stacks/roles-anywhere; see
# docs/runbooks/live-aws-standup.md for the full standup checklist.
#
# Not referenced automatically. Wire via clusters/<name>.yaml:
#
#   components:
#     aws-signing-helper:
#       enabled: true
#       extraValueFiles: [values-homelab.yaml]

enabled: true

# Leaf cert comes from the offline root CA, not cert-manager. Pre-stage
# the Secret before enabling this chart:
#
#   skylab-terraform/scripts/skylab-ca.sh issue aws-signing-helper
#   skylab-terraform/scripts/skylab-ca.sh install-k8s aws-signing-helper external-secrets
#
# That lands Secret external-secrets/aws-signing-helper-client with
# tls.crt + tls.key — the CronJob mounts it directly.
certificate:
  create: false

rolesAnywhere:
  # terraform output trust_anchor_arn
  trustAnchorArn: "arn:aws:rolesanywhere:us-east-2:635314249418:trust-anchor/f2f3484a-7089-4f64-8f40-7b4ee523fc37"
  # terraform output external_secrets_profile_arn
  profileArn: "arn:aws:rolesanywhere:us-east-2:635314249418:profile/38d5ad51-2838-4df6-ab37-40d619fd1c22"
  # terraform output external_secrets_role_arn
  roleArn: "arn:aws:iam::635314249418:role/skylab-external-secrets"
  region: us-east-2

awsSigningHelper:
  version: "1.5.0"
  # Pin the sha256 from the aws_signing_helper 1.5.0 release page before
  # flipping on. Blank skips the digest check (not for prod).
  sha256: "519717f2408f3191e0ec8b35531c41bf20344b94b292cf1d763df4e6fc93af44"

# certificate.commonName default (aws-signing-helper) must match the
# Subject condition on the external-secrets role's trust policy — see
# skylab-terraform/modules/aws-roles-anywhere.
