{{- if .Values.enabled }}
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "aws-signing-helper.name" . }}
  namespace: {{ .Values.namespace.name }}
  labels:
    {{- include "aws-signing-helper.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "aws-signing-helper.name" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "aws-signing-helper.name" . }}
    namespace: {{ .Values.namespace.name }}
{{- end }}
