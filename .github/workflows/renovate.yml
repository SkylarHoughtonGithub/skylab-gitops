name: renovate

# Self-hosted Renovate runner. Fires on a cron and on manual dispatch.
# No external service required; swap for the Mend GitHub App later if you
# want someone else to run it.

on:
  schedule:
    # Floor cadence for third-party deps; owned repos trigger via
    # repository_dispatch below for near-instant propagation.
    - cron: '0 */4 * * *'
  workflow_dispatch:
    inputs:
      logLevel:
        description: 'Renovate log level'
        required: false
        default: 'info'
        type: choice
        options: ['debug', 'info', 'warn']
      dryRun:
        description: 'Dry run (log only, do not open PRs)'
        required: false
        default: 'false'
        type: choice
        options: ['false', 'full']
  # Fired by sibling repos (e.g. skylab-crossplane release.yaml) after
  # a successful publish, so an owned-repo bump reaches here in seconds
  # instead of waiting for the next cron tick.
  repository_dispatch:
    types: [ghcr-package-published]

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: renovatebot/github-action@v41.0.0
        with:
          configurationFile: renovate.json5
          token: ${{ secrets.GITHUB_TOKEN }}
        env:
          LOG_LEVEL: ${{ inputs.logLevel || 'info' }}
          RENOVATE_DRY_RUN: ${{ inputs.dryRun || '' }}
          RENOVATE_REPOSITORIES: '["${{ github.repository }}"]'
