# Wave 10. First workload riding the Skylab `go-service` ComponentDefinition.
# Argo CD applies this; KubeVela expands it into:
#   - api         → Deployment + Service with OTel env, skylab.io/system
#                   labels and /healthz probes baked in by the ComponentDefinition
#   - postgres    → StatefulSet + Service + Secret (dev-only, interim)
#
# Interim decisions worth calling out:
#   - DEV_AUTH_BYPASS=true + ENV=development. Lets the pod come up without
#     a Google OAuth client / session key wired in. Flip these out when
#     real Google credentials land via ExternalSecret.
#   - A plain Postgres StatefulSet with static credentials in a Secret.
#     The password lives in Git — fine for a dev-only, isolated namespace;
#     wrong for anything else. Replaced by a Crossplane `postgres` XR
#     in Phase 2 (database golden-path template proof) — at which point
#     this `postgres` block and the Secret go away and the api's envFrom
#     points at the Crossplane-provisioned connection secret.
#   - Migrations run manually for now: `kubectl exec -n mechatracker
#     deploy/api -- /app/api migrate` is not wired (no migrate binary in
#     the distroless image); use `kubectl exec` into the postgres pod +
#     psql, or `kubectl run migrate --image=migrate/migrate ... up`.
#     Phase 2 adds a migrate Job driven by the database template.
#   - web/ (Next.js) is still Clerk-based; it migrates to Google OAuth
#     in a separate mechatracker PR, then ships as a second api-shaped
#     component (or via a future Next.js ComponentDefinition).
#
# Everything in this file is regenerated by the Backstage `go-service`
# template once skylab-backstage + Gitea come up. Hand-written form
# validates the shape against the ComponentDefinition so the template
# emits something that actually works on first run.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: mechatracker
  namespace: mechatracker
  labels:
    owner: platform
    skylab.io/system: mechatracker
    app.kubernetes.io/name: mechatracker
spec:
  components:
    # Dev-only Postgres. Static credentials, single replica, 10Gi PVC.
    # Interim; replaced by a Crossplane postgres XR in Phase 2.
    - name: postgres
      type: k8s-objects
      properties:
        objects:
          - apiVersion: v1
            kind: Secret
            metadata:
              name: mechatracker-postgres
              namespace: mechatracker
              labels:
                owner: platform
                app.kubernetes.io/name: mechatracker
                app.kubernetes.io/component: postgres
            type: Opaque
            stringData:
              POSTGRES_DB: mechatracker
              POSTGRES_USER: mechatracker
              POSTGRES_PASSWORD: mechatracker
              # URL form consumed by mechatracker's config.Load().
              DATABASE_URL: postgres://mechatracker:mechatracker@mechatracker-postgres:5432/mechatracker?sslmode=disable

          - apiVersion: v1
            kind: Service
            metadata:
              name: mechatracker-postgres
              namespace: mechatracker
              labels:
                owner: platform
                app.kubernetes.io/name: mechatracker
                app.kubernetes.io/component: postgres
            spec:
              selector:
                app.kubernetes.io/name: mechatracker
                app.kubernetes.io/component: postgres
              ports:
                - name: postgres
                  port: 5432
                  targetPort: 5432

          - apiVersion: apps/v1
            kind: StatefulSet
            metadata:
              name: mechatracker-postgres
              namespace: mechatracker
              labels:
                owner: platform
                app.kubernetes.io/name: mechatracker
                app.kubernetes.io/component: postgres
            spec:
              serviceName: mechatracker-postgres
              replicas: 1
              selector:
                matchLabels:
                  app.kubernetes.io/name: mechatracker
                  app.kubernetes.io/component: postgres
              template:
                metadata:
                  labels:
                    app.kubernetes.io/name: mechatracker
                    app.kubernetes.io/component: postgres
                    skylab.io/system: mechatracker
                spec:
                  containers:
                    - name: postgres
                      image: postgres:17-alpine
                      ports:
                        - name: postgres
                          containerPort: 5432
                      envFrom:
                        - secretRef:
                            name: mechatracker-postgres
                      # PGDATA under a subdirectory lets Postgres start on an
                      # ext4 volume with lost+found at the mount root.
                      env:
                        - name: PGDATA
                          value: /var/lib/postgresql/data/pgdata
                      volumeMounts:
                        - name: data
                          mountPath: /var/lib/postgresql/data
                      readinessProbe:
                        exec:
                          command: ["pg_isready", "-U", "mechatracker", "-d", "mechatracker"]
                        initialDelaySeconds: 5
                        periodSeconds: 10
                      livenessProbe:
                        exec:
                          command: ["pg_isready", "-U", "mechatracker", "-d", "mechatracker"]
                        initialDelaySeconds: 30
                        periodSeconds: 20
              volumeClaimTemplates:
                - metadata:
                    name: data
                  spec:
                    accessModes: ["ReadWriteOnce"]
                    resources:
                      requests:
                        storage: 10Gi

    - name: api
      type: go-service
      # dependsOn makes the StatefulSet come up before the api so the
      # first pool.Ping() at startup actually finds a listener.
      dependsOn:
        - postgres
      properties:
        image: ghcr.io/skylarhoughtongithub/mechatracker-api:latest
        port: 8080
        # otelEndpoint + otelInsecure default to the in-cluster Alloy
        # listener; override here when Alloy fronts an mTLS listener.
        env:
          # DEV_AUTH_BYPASS short-circuits Google ID-token verification
          # and injects the dev seed user. config.validate() rejects it
          # outside ENV=development, so ENV goes alongside.
          - name: ENV
            value: development
          - name: DEV_AUTH_BYPASS
            value: "true"
        envFrom:
          # DATABASE_URL + the POSTGRES_* vars (unused by the api but
          # harmless) come from the same Secret the postgres pod uses.
          - secretRef:
              name: mechatracker-postgres
