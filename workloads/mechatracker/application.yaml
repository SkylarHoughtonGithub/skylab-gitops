# Wave 10. Hand-written baseline for mechatracker's Go API — the first
# workload riding the Skylab `go-service` ComponentDefinition. Argo CD
# applies this; KubeVela expands it into a Deployment + Service with
# OTel env, skylab.io/system labels and /healthz probes baked in.
#
# Known gaps (follow-up PRs):
#   - go-service ComponentDefinition does not yet accept envFrom secret
#     refs or arbitrary extra env. mechatracker needs DATABASE_URL +
#     SESSION_SIGNING_KEY + (GOOGLE_CLIENT_ID or DEV_AUTH_BYPASS=true)
#     to pass config.validate(). Without them the pod CrashLoopBackOffs
#     on startup. This Application is a shape proof, not a running
#     deployment, until the ComponentDefinition grows env support.
#   - No Postgres in the cluster yet. mechatracker's `infra/helm/` chart
#     bundles its own StatefulSet; replacing that with a Crossplane
#     `postgres` XR is Phase 2 (database golden-path template proof).
#   - web/ (Next.js) is still Clerk-based; it migrates to Google OAuth
#     in a separate mechatracker PR before shipping as a second
#     component here.
#
# Everything in this file will be regenerated by the Backstage
# `go-service` template once skylab-backstage + Gitea are live. The
# hand-written form validates the shape against the ComponentDefinition
# so the template emits something that actually works on first run.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: mechatracker
  namespace: mechatracker
  labels:
    owner: platform
    skylab.io/system: mechatracker
    app.kubernetes.io/name: mechatracker
spec:
  components:
    - name: api
      type: go-service
      properties:
        image: ghcr.io/skylarhoughtongithub/mechatracker-api:latest
        port: 8080
        # otelEndpoint + otelInsecure default to the in-cluster Alloy
        # listener; override here when Alloy fronts an mTLS listener.
