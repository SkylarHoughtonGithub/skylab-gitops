# Wave 10. First workload riding the Skylab `go-service` ComponentDefinition.
# Argo CD applies this; KubeVela expands it into:
#   - api → Deployment + Service with OTel env, skylab.io/system labels and
#     /healthz probes baked in by the ComponentDefinition
#
# Postgres is now a sibling Application (`workloads/mechatracker-db/`) that
# emits an XPostgres XR + a compose Job that derives DATABASE_URL into the
# `db-url` secret in this namespace. The api's envFrom below picks it up.
#
# Phase 2 cutover (this file): the interim k8s-objects Postgres and its
# static-cred Secret are gone. The api is broken on any cluster that
# doesn't have Crossplane + cloud credentials running (dev k3d included) —
# dev stays red until wave 1 + mechatracker-db come up on a real cluster.
#
# Still interim:
#   - DEV_AUTH_BYPASS=true + ENV=development to skip Google OAuth client
#     wiring. Flip out when real Google credentials land via ExternalSecret.
#   - Migrations run manually. A migrate Job tied to the postgres
#     ComponentDefinition is a follow-up.
#   - web/ (Next.js) ships via a separate component once a Next.js
#     ComponentDefinition exists.
#
# Everything here is regenerated by the Backstage `go-service` template
# once skylab-backstage + Gitea come up; hand-written form validates the
# shape against the ComponentDefinitions so the template emits something
# that works on first run.
apiVersion: core.oam.dev/v1beta1
kind: Application
metadata:
  name: mechatracker
  namespace: mechatracker
  labels:
    owner: platform
    skylab.io/system: mechatracker
    app.kubernetes.io/name: mechatracker
spec:
  components:
    - name: api
      type: go-service
      properties:
        image: ghcr.io/skylarhoughtongithub/mechatracker-api:latest
        port: 8080
        # otelEndpoint + otelInsecure default to the in-cluster Alloy
        # listener; override here when Alloy fronts an mTLS listener.
        env:
          # DEV_AUTH_BYPASS short-circuits Google ID-token verification
          # and injects the dev seed user. config.validate() rejects it
          # outside ENV=development, so ENV goes alongside.
          - name: ENV
            value: development
          - name: DEV_AUTH_BYPASS
            value: "true"
        envFrom:
          # DATABASE_URL arrives via the `db-url` secret written by the
          # compose Job in the sibling mechatracker-db Application.
          - secretRef:
              name: db-url
